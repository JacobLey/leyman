# Every linter is on, as with ESLint and Clippy. A linter or a path is only turned off here with its reason.
version: '2'

run:
  # Nx lints Go projects in parallel. Each only reads its own project, and the default lock makes one
  # fail with "parallel golangci-lint is running" once another has held it for more than a moment
  allow-parallel-runners: true
  # fork-manifest:repo-only
  # Files behind a tag are still linted: `interop` holds tests that call a server they don't start
  # (demos/openapi/go/client/interop_test.go), which a plain `go test` leaves out
  build-tags:
    - interop
  # fork-manifest:end

linters:
  default: all
  disable:
    # Deprecated, each replaced by its `_v2` or `_v5` linter, which stays on
    - exhaustruct
    - gomodguard
    - wsl
    # Needs a policy of allowed imports, and this repo has none to enforce
    - depguard
    # Nothing wraps Go code automatically, and neither image digests nor Dagger's `+ignore` pragma can wrap by hand
    - lll
    # `if err := f(); err != nil` is the Go idiom, and keeps `err` scoped to the check
    - noinlineerr
  settings:
    gomoddirectives:
      # A workspace project depends on another through a local `replace`, as it's never fetched
      replace-local: true
    # fork-manifest:when dagger
    godot:
      # Dagger's pragmas, like `+cache="never"`, have to end a doc comment as they are
      exclude:
        - ^\s*\+
    recvcheck:
      # The generated `dagger.gen.go` gives the module's type both kinds of receiver
      exclusions:
        - Ci.MarshalJSON
    # fork-manifest:end
    wrapcheck:
      ignore-package-globs:
        # fork-manifest:when dagger
        # The engine's errors already name the query that failed
        - dagger/ci/internal/dagger
        # fork-manifest:end
        # A group only returns its own functions' errors
        - golang.org/x/sync/errgroup
        # fork-manifest:repo-only
        # genever's own errors, built as errors.New builds one
        - github.com/JacobLey/leyman/apps/genever/go/internal/gerr
        # fork-manifest:end
  exclusions:
    generated: lax
    # The error from closing what was only read has nothing to report
    presets:
      - std-error-handling
    # fork-manifest:when dagger
    paths:
      - dagger/internal/
    # fork-manifest:end
    rules:
      # fork-manifest:when dagger
      # Its doc comments are the CLI's help text (`dagger call --help`), not godoc
      - path: dagger/main\.go
        linters:
          - godoclint
      # Its errors are only printed by the CLI, and no caller compares them
      - path: dagger/main\.go
        linters:
          - err113
      # The words of a command line aren't one value that should change together
      - path: dagger/main\.go
        linters:
          - goconst
      # The SDK's `*Opts` structs are optional arguments: a missing field means the default
      - text: dagger\.\w+Opts is missing
        linters:
          - exhaustruct_v5
      # A port number is named by the function it is passed to
      - source: WithExposedPort
        linters:
          - mnd
      # `dagger develop` writes these `replace` directives
      - path: dagger/go\.mod
        linters:
          - gomoddirectives
      # fork-manifest:end
      # A test's expected values read best written out where they're compared, even when two tests expect the same
      - path: _test\.go
        linters:
          - goconst
      # fork-manifest:repo-only
      # Its numbers are the hash's specified constants and bit widths, which a name wouldn't explain further
      - path: tools/constant-consistent-hash/go/
        linters:
          - mnd
      # A notes API result is one response: exactly one of its fields is set, by design
      - path: demos/openapi/go/
        text: notes\.\w+Result is missing
        linters:
          - exhaustruct_v5
      # fork-manifest:end

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    # fork-manifest:when dagger
    paths:
      - dagger/internal/
    # fork-manifest:end
