packages:
  - apps/**
  - leyman/*
  - tools/*
  - tools/constant-consistent-hash/*
  - tools/generated-signature/*
  - tools/test-chain/*
  - e2e/*
  - demos/*
  - demos/blake3-wasm/*
  - demos/openapi/*
  - demos/agents/*
  - infra/nx-cache/*
  - docs
  - '!**/test/**'

autoInstallPeers: false
disallowWorkspaceCycles: true
# Install workspace dependencies as copies of their published files, with peers resolved from each dependent,
# like a package from the registry. Builds keep the copies current (`sync-injected`).
injectWorkspacePackages: true
# Otherwise pnpm symlinks to the source again whenever peers allow it, which is nearly always
dedupeInjectedDeps: false
# Where pnpm links the skills that approved dependencies ship. Not .claude/skills too: it is a link to this one
skills:
  dirs:
    - .agents/skills
# This workspace's packages ship skills that leyman/main/scripts/link-skills.mjs links to their source, current as they
# are edited, where pnpm would link the injected copies, current only after a build
permissions:
  '@leyman/configs@file:leyman/configs':
    skills: false
  '@leyman/eslint-config@file:leyman/eslint-config':
    skills: false
  '@leyman/framework@file:leyman/framework':
    skills: false
  mocha-chain@file:tools/test-chain/mocha-chain:
    skills: false
  nx-lifecycle@file:apps/nx-lifecycle:
    skills: false

# Required for Docker install
packageImportMethod: clone-or-copy

hoistPattern:
  - '!*'
publicHoistPattern:
  - '!*'

# `storeDir` is intentionally unset: it would override `pnpm_config_store_dir`,
# which Dagger and the devcontainer each set to point at their own store.

# Supply-chain protections

# Only install versions published at least 7 days ago (in minutes)
minimumReleaseAge: 10080
# Fail if a package's publish trust level (e.g. provenance) drops compared to earlier versions
trustPolicy: no-downgrade
trustPolicyExclude:
  # Old releases (already in the lockfile) published by the same maintainers without provenance,
  # after an earlier release or a newer major had it
  - chokidar@4.0.3
  - semver@6.3.1
  # `@types/node` 22 (the `node-22` catalog) pins `undici-types@~6.21.0`
  - undici-types@6.21.0
  - why-is-node-running@3.2.2
# Transitive dependencies may only come from the registry (no git/tarball URLs)
blockExoticSubdeps: true
# Fail on unapproved dependency build scripts instead of silently skipping them
strictDepBuilds: true
allowBuilds:
  '@swc/core': false
  esbuild: false
  nx: false
  # Via @valkey/valkey-glide. Its postinstall only warns when a dependent's version range for it looks unusual
  protobufjs: false
  # Native bindings, but gonx only loads the `tree-sitter-go.wasm` the package ships
  tree-sitter-go: false
  unrs-resolver: false
  # Via wrangler and miniflare. Its postinstall only checks that the platform binary (an optional dependency) is there
  workerd: false

peerDependencyRules:
  allowedVersions:
    # No release declares ESLint 10 yet, but they run on it (`@leyman/eslint-config` adapts eslint-plugin-react's rules).
    # Remove once they do: jsx-eslint/eslint-plugin-jsx-a11y#1081 and jsx-eslint/eslint-plugin-react#4022.
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'

packageExtensions:
  # @nx/js imports typescript without declaring it, so pnpm's strict layout can't resolve it. As a peer, it resolves to
  # @leyman/main's.
  '@nx/js':
    peerDependencies:
      typescript: '*'
  # drizzle-kit imports drizzle-orm (to check their versions match, and to read schemas) and a driver (to migrate)
  # without declaring them, so pnpm's strict layout can't resolve them. As peers, they resolve to the project's own.
  drizzle-kit:
    peerDependencies:
      drizzle-orm: '*'
      pg: '*'
    peerDependenciesMeta:
      pg:
        optional: true

overrides:
  # nx (7.29.0), miniflare 4 (7.28.0) and wrangler's miniflare 5 prerelease (7.29.1) pin undici exactly,
  # below the advisory fixes in 7.30.1. Remove once none of them pins a version below that.
  undici@7: ^7.30.1
  # miniflare 4 pins sharp exactly at 0.35.2 (libheif and librsvg advisories fixed in 0.35.5), and its stable line
  # has had no release since. Remove once a miniflare 4 release depends on >=0.35.5.
  miniflare>sharp: 0.35.5
  # eslint, nx, mocha, test-exclude, typescript-estree, sonarjs and @swc/cli allow minimatch 10 (or 9) at most, below
  # the pattern amplification fix in 11.0.1, and mocha and test-exclude allow glob 13 at most, below the abort fix in
  # 14.0.2. They only call APIs both majors share. Remove each once none of them allows a version below its fix.
  minimatch@>=7 <11.0.1: ^11.0.1
  glob@>=9 <14.0.2: ^14.0.2
  # eslint-plugin-import-x 4.17 imports `makeRe`, which minimatch 11 removed, so it keeps minimatch 10 (it only
  # compiles patterns from the config, never untrusted input). Remove when the catalog moves to 4.18, which takes 11.
  eslint-plugin-import-x>minimatch: ^10.2.6
  # Optional peer of @vueuse/integrations (via vitepress) for its `useAxios` composable, which the docs site never uses.
  # pnpm still resolves it, so remove it outright.
  '@vueuse/integrations>axios': '-'
  # drizzle-kit declares it but never loads it (its bundle uses esbuild directly), and it brings esbuild 0.18,
  # which has a dev server advisory fixed in 0.25.
  drizzle-kit>@esbuild-kit/esm-loader: '-'

catalog:
  '@apidevtools/swagger-parser': ^13.1.0
  '@arethetypeswrong/core': ^0.18.5
  '@biomejs/biome': ^2.6.4
  '@changesets/cli': ^3.0.3
  '@happy-dom/global-registrator': ^21.0.4
  '@hono/node-server': ^2.1.5
  json-schema-to-ts: ^3.1.1
  json-schema-to-typescript: ^16.0.0
  json-schema-to-zod: ^2.8.1
  '@modelcontextprotocol/client': ^2.4.0
  '@modelcontextprotocol/server': ^2.4.0
  '@naxodev/gonx': ^4.1.2
  '@noble/hashes': ^2.4.0
  '@nx/devkit': ^23.3.1
  '@nx/js': ^23.3.1
  openapi-typescript: ^7.13.0
  quicktype-core: ^26.0.0
  semver: ^7.8.5
  '@shikijs/vitepress-twoslash': ^4.5.0
  '@standard-schema/spec': ^1.1.0
  '@swc/cli': ^0.8.2
  '@swc/core': ^1.16.20
  '@tanstack/react-query': ^5.105.0
  '@testing-library/dom': ^10.4.2
  '@testing-library/react': ^16.3.3
  typebox: ^1.4.3
  '@types/chai': ^5.2.3
  '@types/chai-as-promised': ^8.0.2
  '@types/eslint': ^9.6.1
  '@types/mocha': ^10.0.10
  '@types/node': ^26.6.6
  '@types/oidc-provider': ^9.13.1
  '@types/pg': ^8.23.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@types/semver': ^7.8.0
  '@types/sinon': ^22.0.2
  '@types/tmp': ^0.2.6
  '@types/vscode': ^1.137.0
  '@types/yargs': ^17.0.35
  '@typescript/native': npm:typescript@^7.0.2
  '@valkey/valkey-glide': ^2.5.3
  ajv: ^8.20.0
  ajv-draft-04: ^1.0.0
  ajv-formats: ^3.0.1
  bentocache: ^1.6.1
  c8: ^12.0.0
  chai: ^6.2.2
  chai-as-promised: ^8.0.2
  ci-info: ^4.4.0
  comlink: ^4.4.2
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  ensure-error: ^5.0.0
  escape-string-regexp: ^5.0.0
  eslint: ^10.14.0
  eslint-config-prettier: ^10.1.8
  expect-type: ^1.4.0
  fast-check: ^4.10.2
  fast-equals: ^6.2.1
  fastify: ^5.12.6
  find-up: ^8.0.0
  globals: ^17.13.0
  hono: ^4.13.14
  ignore: ^7.0.14
  inversify: ^8.2.3
  # bentocache's peer dependency allows ^5 only
  ioredis: ^5.11.1
  iovalkey: ^0.4.0
  jose: ^6.2.14
  lru-cache: ^11.5.3
  # The stable line, for tests. wrangler 4 ships a 5.x prerelease of its own, whose options are still changing
  miniflare: ^4.20260730.0
  mocha: ^12.0.3
  normalize-exception: ^4.0.1
  nx: ^23.3.1
  oauth4webapi: ^3.8.8
  oidc-provider: ^9.13.3
  openapi-types: ^12.1.3
  openapi3-ts: ^4.6.2
  p-defer: ^4.0.1
  pg: ^8.23.1
  # Pinned: browser builds are tied to this version, so keep `PLAYWRIGHT_VERSION` in `.devcontainer/Dockerfile` and
  # `dagger/main.go` in sync.
  playwright: 1.64.1
  pony-cause: ^2.1.11
  prettier: ^3.9.10
  publint: ^0.3.25
  react: ^19.3.1
  react-dom: ^19.3.1
  redis: ^6.3.1
  reflect-metadata: ^0.2.2
  serialize-error: ^13.0.2
  sinon: ^22.1.0
  tinyglobby: ^0.2.17
  tmp-promise: ^3.0.3
  ts-dedent: ^2.3.0
  tsyringe: ^4.10.0
  # TypeScript 7 ships no compiler API (expected in 7.1), so `typescript` stays TypeScript 6 for tools that
  # load it as a library (Nx's `@nx/js:typescript-sync` generator, typescript-eslint), while `@typescript/native`
  # provides TypeScript 7's `tsc`. Packages that compile TypeScript depend on both.
  typescript: npm:@typescript/typescript6@^6.0.2
  # The TypeScript floor of published packages: `floor-types` (in `e2e/published-entrypoints`) checks their
  # declarations and type tests with it. Pinned exactly; only bump it when the floor is raised.
  typescript-floor: npm:typescript@6.0.2
  uint8array-extras: ^1.6.0
  vite: ^8.3.5
  # Pinned: VitePress 2 is in alpha, where any release may change its config. The docs build (which
  # type-checks every example) catches breakage, so bump it deliberately and run `nx run @leyman/docs:build`.
  vitepress: 2.0.0-alpha.20
  vitest: ^5.0.3
  wrangler: ^4.156.0
  yaml: ^2.9.1
  yargs: ^18.2.0

  zod: ^4.6.7
catalogs:
  # TypeScript's next release, for content-mapper packages and the demos that use them only: every other package stays
  # on the stable `catalog:`. Pinned exactly, since `^` doesn't match prereleases. Delete this catalog once the stable
  # release is 7 days old, moving `catalog:` to it.
  typescript-next:
    '@typescript/native': npm:typescript@7.1.0-beta
  # The rules `@leyman/eslint-config` turns on come from these, so its published ranges take patches only: a minor can
  # add rules (all on, as errors), which consumers get with the config's next release instead
  eslint-rules:
    '@eslint-community/eslint-plugin-eslint-comments': ~4.8.1
    '@eslint/js': ~10.0.1
    '@typescript-eslint/eslint-plugin': ~8.72.1
    '@typescript-eslint/parser': ~8.72.1
    '@typescript-eslint/utils': ~8.72.1
    eslint-plugin-import-x: ~4.17.1
    eslint-plugin-jsdoc: ~65.4.2
    'eslint-plugin-jsx-a11y': ~6.10.2
    eslint-plugin-n: ~18.5.0
    eslint-plugin-react: ~7.37.5
    eslint-plugin-react-hooks: ~7.1.1
    eslint-plugin-regexp: ~3.3.2
    eslint-plugin-sonarjs: ~4.2.2
    eslint-plugin-unicorn: ~79.0.0
  # `@types/node` for published packages, one catalog per support floor: a package uses the one its `engines.node`
  # names (checked by `check-package`), so its source can't use an API newer than the oldest Node.js it supports.
  # The default `catalog:` follows the toolchain.
  node-22:
    '@types/node': ^22.20.5
  node-24:
    '@types/node': ^24.19.2
# Each patch fixes a bug that a release doesn't yet. Delete it once a release with the fix is at least 7 days old.
patchedDependencies:
  # `prefer-string-starts-ends-with` parses a `v`-flag RegExp as if it had no flags, so it autofixes `/^\p{N}/v.test(s)`
  # to `s.startsWith('p{N}')`
  '@typescript-eslint/eslint-plugin@8.72.1': patches/@typescript-eslint__eslint-plugin@8.72.1.patch
  # Without the daemon, as in Docker and CI, each wave of task hashing copies the whole task graph to native code with
  # every result written onto it so far, about 112s of a warm `verify`. Nx prunes those results for the daemon only
  nx@23.3.1: patches/nx@23.3.1.patch
