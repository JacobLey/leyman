packages:
  - apps/**
  - leyman/*
  - tools/*
  - tools/constant-consistent-hash/*
  - tools/generated-signature/*
  - tools/test-chain/*
  - e2e/*
  - demos/*
  - demos/openapi/*
  - demos/agents/*
  - infra/nx-cache/*
  - docs
  - '!**/test/**'

autoInstallPeers: false
disallowWorkspaceCycles: true
# Install workspace dependencies as copies of their published files, with peers resolved from each dependent,
# like a package from the registry. Builds keep the copies current (`sync-injected`).
injectWorkspacePackages: true
# Otherwise pnpm symlinks to the source again whenever peers allow it, which is nearly always
dedupeInjectedDeps: false

# Required for Docker install
packageImportMethod: clone-or-copy

hoistPattern:
  - '!*'
publicHoistPattern:
  - '!*'

# `storeDir` is intentionally unset: it would override `pnpm_config_store_dir`,
# which Dagger and the devcontainer each set to point at their own store.

# Supply-chain protections

# Only install versions published at least 7 days ago (in minutes)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Packages published from this repo, consumed via `npm:` aliases in catalogs below (or as their dependencies)
  - barrelify
  - entry-script
  - format-file
  - generated-signature
  - haywire
  - haywire-launcher
  - juniper
  - parse-cwd
  - populate-files
  - unknown-error
# Fail if a package's publish trust level (e.g. provenance) drops compared to earlier versions
trustPolicy: no-downgrade
trustPolicyExclude:
  # Old releases (already in the lockfile) published by the same maintainers without provenance,
  # after an earlier release or a newer major had it
  - chokidar@4.0.3
  - semver@6.3.1
  - why-is-node-running@3.2.2
# Transitive dependencies may only come from the registry (no git/tarball URLs)
blockExoticSubdeps: true
# Fail on unapproved dependency build scripts instead of silently skipping them
strictDepBuilds: true
allowBuilds:
  '@swc/core': false
  esbuild: false
  nx: false
  # Via @valkey/valkey-glide. Its postinstall only warns when a dependent's version range for it looks unusual
  protobufjs: false
  # Native bindings, but gonx only loads the `tree-sitter-go.wasm` the package ships
  tree-sitter-go: false
  unrs-resolver: false
  # Via wrangler and miniflare. Its postinstall only checks that the platform binary (an optional dependency) is there
  workerd: false

peerDependencyRules:
  allowedVersions:
    # No release declares ESLint 10 yet, but they run on it (`@leyman/eslint-config` adapts eslint-plugin-react's rules).
    # Remove once they do: jsx-eslint/eslint-plugin-jsx-a11y#1081 and jsx-eslint/eslint-plugin-react#4022.
    eslint-plugin-jsx-a11y>eslint: '10'
    eslint-plugin-react>eslint: '10'

packageExtensions:
  # drizzle-kit imports drizzle-orm (to check their versions match, and to read schemas) and a driver (to migrate)
  # without declaring them, so pnpm's strict layout can't resolve them. As peers, they resolve to the project's own.
  drizzle-kit:
    peerDependencies:
      drizzle-orm: '*'
      pg: '*'
    peerDependenciesMeta:
      pg:
        optional: true

overrides:
  # nx (7.29.0), miniflare 4 (7.28.0) and wrangler's miniflare 5 prerelease (7.29.1) pin undici exactly,
  # below the advisory fixes in 7.30.1. Remove once none of them pins a version below that.
  undici@7: ^7.30.1
  # miniflare 4 pins sharp exactly at 0.35.2 (libheif and librsvg advisories fixed in 0.35.5), and its stable line
  # has had no release since. Remove once a miniflare 4 release depends on >=0.35.5.
  miniflare>sharp: 0.35.5
  # Optional peer of @vueuse/integrations (via vitepress) for its `useAxios` composable, which the docs site never uses.
  # pnpm still resolves it, so remove it outright.
  '@vueuse/integrations>axios': '-'
  # drizzle-kit declares it but never loads it (its bundle uses esbuild directly), and it brings esbuild 0.18,
  # which has a dev server advisory fixed in 0.25.
  drizzle-kit>@esbuild-kit/esm-loader: '-'

