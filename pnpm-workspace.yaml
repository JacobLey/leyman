packages:
  - apps/**
  - leyman/*
  - tools/*
  - tools/test-chain/*
  - '!**/test/**'

autoInstallPeers: false
disallowWorkspaceCycles: true
forceLegacyDeploy: true

# Required for Docker install
packageImportMethod: clone-or-copy

hoistPattern:
  - '!*'
publicHoistPattern:
  - '!*'

# `storeDir` is intentionally unset: it would override `npm_config_store_dir`,
# which Dagger and the devcontainer each set to point at their own store.

# Supply-chain protections

# Only install versions published at least 7 days ago (in minutes)
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # Packages published from this repo, consumed via `npm:` aliases in catalogs below
  - barrelify
  - juniper
# Fail if a package's publish trust level (e.g. provenance) drops compared to earlier versions
trustPolicy: no-downgrade
trustPolicyExclude:
  # Old releases (already in the lockfile) published without provenance after a newer major had it
  - chokidar@4.0.3
  - semver@6.3.1
# Transitive dependencies may only come from the registry (no git/tarball URLs)
blockExoticSubdeps: true
# Fail on unapproved dependency build scripts instead of silently skipping them
strictDepBuilds: true
onlyBuiltDependencies: []
ignoredBuiltDependencies:
  - '@swc/core'
  - nx

