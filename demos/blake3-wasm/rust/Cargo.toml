[package]
name = "demo-blake3-wasm"
version = "0.0.1"
description = "BLAKE3 from the blake3 crate, compiled to WASM with SIMD, for the blake3-wasm demo."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `cdylib` is what wasm-bindgen reads, `rlib` is what the tests link
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = { version = "=1.8.7", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Hand-written SIMD, for 4 chunks at a time. The feature needs no compiler flags: only these functions use it
blake3 = { version = "=1.8.7", default-features = false, features = ["wasm32_simd"] }
# Keep in sync with `wasm-bindgen-cli`, see the devcontainer skill. Exact, as a mismatch fails the build
wasm-bindgen = "=0.2.129"

[dev-dependencies]
serde_json = "1.0.154"

[lints]
workspace = true
