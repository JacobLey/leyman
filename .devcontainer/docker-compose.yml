# MAIN_CHECKOUT and WORKTREES_DIR come from `.devcontainer/.env`, written by `initialize.sh`
# (the devcontainer `initializeCommand`).

services:
  leyman:
    build:
      context: .
      dockerfile: Dockerfile

    entrypoint:
      - /usr/local/share/docker-init.sh

    volumes:
      # Mounted at the identical host paths so git worktree links work on both sides
      - ${MAIN_CHECKOUT:?run .devcontainer/initialize.sh}:${MAIN_CHECKOUT}:delegated
      - ${WORKTREES_DIR:?run .devcontainer/initialize.sh}:${WORKTREES_DIR}:delegated

    environment:
      CLAUDE_CONFIG_DIR: ${WORKTREES_DIR}/.shared/claude-config
      # `gh auth login` once, in any worktree, logs in every one
      GH_CONFIG_DIR: ${WORKTREES_DIR}/.shared/gh-config
      # Every worktree installs from one shared store
      pnpm_config_store_dir: ${WORKTREES_DIR}/.shared/pnpm-store
      # Browsers for Playwright tests, downloaded once and kept across rebuilds
      PLAYWRIGHT_BROWSERS_PATH: ${WORKTREES_DIR}/.shared/playwright-browsers
      NX_SELF_HOSTED_REMOTE_CACHE_SERVER: http://nx-cache:3000
      # The `postgres` sidecar. A fixed dev password: local-only, not a secret
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres

    depends_on:
      - nx-cache
      - valkey
      - postgres

    # Overrides default command so things don't shut down after the process ends.
    command:
      - sleep
      - infinity

  # Shares Nx task outputs across worktrees (Nx's local cache is per-worktree)
  nx-cache:
    image: node:24.22.1-trixie-slim
    command:
      - node
      - /server/nx-cache-server.mjs
    volumes:
      - ./nx-cache-server.mjs:/server/nx-cache-server.mjs:ro
      - ${WORKTREES_DIR}/.shared/nx-cache:/cache
    environment:
      # Reads results it doesn't have from the hosted cache that CI on main writes to (`infra/nx-cache`), never
      # writes there. Empty until the cache is deployed: then set to the Worker's URL
      NX_CACHE_SERVER_UPSTREAM: ${NX_CACHE_SERVER_UPSTREAM:-}
    restart: unless-stopped

  # For tests that run against Valkey, at `valkey:6379`: Dagger binds its service under the same hostname.
  # One per worktree (unlike the shared caches), so concurrent test runs never see each other's keys.
  # Keep the image in sync with `valkeyImage` in `dagger/main.go`.
  valkey:
    image: valkey/valkey:9.1.2-trixie@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    # Data only lives as long as the container: tests never rely on it surviving
    command:
      - valkey-server
      - --save
      - ''
      - --appendonly
      - 'no'
    restart: unless-stopped

  # For tests that run against Postgres, at `postgres:5432` (`DATABASE_URL` above): Dagger binds its service under
  # the same hostname. One per worktree, like `valkey`.
  # Keep the image and settings in sync with `postgresImage` and `postgresService` in `dagger/main.go`.
  postgres:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    environment:
      POSTGRES_PASSWORD: postgres
    # Nothing is persisted (in memory, not even an anonymous volume), so a restart starts from empty.
    # Dev data comes from scripts, never from what a database happens to hold.
    tmpfs:
      - /var/lib/postgresql
    # Durability off for speed: only a crash of the machine or VM can corrupt the data, and none of it is kept anyway.
    # More connections, since tests across parallel Nx tasks share the one server.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=500
    restart: unless-stopped
