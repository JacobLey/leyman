[package]
name = "constant-consistent-hash-rust"
version = "0.0.1"
description = "Rust implementation of constant-consistent-hash, compiled to WASM for TypeScript."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `cdylib` is what wasm-bindgen reads, `rlib` is what the tests link
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Keep in sync with `wasm-bindgen-cli`, see the devcontainer skill. Exact, as a mismatch fails the build
wasm-bindgen = "=0.2.129"

[dev-dependencies]
serde_json = "1.0.154"
testvectors = { path = "../test-vectors" }

[lints]
workspace = true
