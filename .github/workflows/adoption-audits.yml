name: Adoption audits

# Proves the two ways another repository adopts this setup by running them, from the registry (see `fork-manifest-audit`
# and `starter-audit` in the nx-tasks-reference skill). They report rather than gate: what they catch comes from new
# releases upstream as much as from changes here.
#
# - `fork-manifest`: applies `leyman/main/fork-manifest.json`, as a fork copies files. `check-fork-manifest` catches a
#   wrong classification on every PR; this catches what only shows up when a fork actually runs.
# - `starter`: runs the getting-started page's commands, as a new workspace installs the published packages.
on:
  workflow_dispatch:
  # Off the top of the hour, when GitHub delays and drops scheduled runs
  schedule:
    - cron: '23 10 * * 1'

permissions:
  contents: read

env:
  # Keep in sync with `DAGGER_VERSION` in `ci.yml`
  DAGGER_VERSION: 0.21.11

jobs:
  fork-manifest:
    runs-on: ubuntu-latest
    # A cold run takes well under this; fail a hung pipeline instead of waiting out the 6 hour default
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger
          # Only for Dagger Cloud traces, as in `ci.yml`
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: fork-manifest-audit

  starter:
    runs-on: ubuntu-latest
    # A cold run takes well under this; fail a hung pipeline instead of waiting out the 6 hour default
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger
          # Only for Dagger Cloud traces, as in `ci.yml`
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: starter-audit
