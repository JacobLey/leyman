name: CI

on:
  # Never run PR code from `pull_request_target` or `workflow_run`: they run with main's cache
  # scope and secrets, so the PR could poison main's Nx cache or steal tokens
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Superseded PR pushes are cancelled; every commit to main gets its own run
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

env:
  # Keep in sync with `engineVersion` in `dagger/dagger.json` and `.devcontainer/Dockerfile`
  DAGGER_VERSION: 0.21.10
  # Outside the checkout, so it is never part of the source Dagger tests
  NX_CACHE_DIR: /tmp/nx-cache
  # Bump to discard every cached Nx result (e.g. after finding an input Nx doesn't hash)
  NX_CACHE_VERSION: v1
  # Cached Nx results older than this are never served
  NX_CACHE_MAX_AGE_DAYS: 7

jobs:
  test:
    runs-on: ubuntu-latest
    # A cold run takes well under this; fail a hung pipeline instead of waiting out the 6 hour default
    timeout-minutes: 30
    permissions:
      contents: read
      # The cache server's uploads to the hosted cache carry an OIDC token. The hosted cache only accepts one from a
      # push to main, so a pull request's token (and a fork's gets none) can't write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # PRs can read main's cache, but main never reads a PR's
      - name: Restore Nx cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NX_CACHE_DIR }}
          key: nx-${{ env.NX_CACHE_VERSION }}-${{ github.sha }}
          restore-keys: nx-${{ env.NX_CACHE_VERSION }}-

      # Deletes expired results before it starts listening, and never serves one. In front of the hosted cache
      # (`infra/nx-cache`) once the `NX_CACHE_UPSTREAM` variable names it: every run reads from it, and pushes to
      # main write to it
      - name: Start Nx cache server
        env:
          NX_CACHE_SERVER_DIR: ${{ env.NX_CACHE_DIR }}
          NX_CACHE_SERVER_MAX_AGE_DAYS: ${{ env.NX_CACHE_MAX_AGE_DAYS }}
          NX_CACHE_SERVER_UPSTREAM: ${{ vars.NX_CACHE_UPSTREAM }}
          NX_CACHE_SERVER_UPSTREAM_WRITE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.NX_CACHE_UPSTREAM != '' && 'github-oidc' || '' }}
        run: |
          node .devcontainer/nx-cache-server.mjs &
          curl --silent --retry 10 --retry-connrefused --retry-delay 1 http://localhost:3000/ > /dev/null

      - name: Test
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger
          # Only for Dagger Cloud traces when debugging. PR runs get this token too, so never
          # enable Dagger Cloud caching on it: that cache isn't scoped by branch like actions/cache,
          # so a PR could write results that main's runs then trust.
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: test --nx-cache=tcp://localhost:3000

      # Saved even when tests fail, so tasks that passed are not re-run
      - name: Save Nx cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.NX_CACHE_DIR }}
          key: nx-${{ env.NX_CACHE_VERSION }}-${{ github.sha }}

  # Opens (or updates) a "Version Packages" PR applying pending changesets
  version:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Only the latest main commit's version PR matters
    concurrency:
      group: version
      cancel-in-progress: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Changelogs reference the commit that added each changeset
          fetch-depth: 0
          persist-credentials: false

      - name: Apply changesets
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: version export --path .

      # Reuses the versioned result from the previous step
      - name: Describe releases
        id: notes
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: version-notes

      # Does nothing when there are no pending changesets
      - name: Open version PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: changeset-release/main
          delete-branch: true
          title: Version Packages
          commit-message: Version Packages
          body: ${{ steps.notes.outputs.output }}

  # Publishes every package whose version is not yet on npm (i.e. after a version PR merges)
  publish:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    # Restricted to main; npm trusted publishing only accepts this environment
    environment: npm
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      # Push release tags
      contents: write
      # npm trusted publishing (OIDC) and provenance
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # npm runs inside Dagger, so hand it the GitHub Actions environment it uses for OIDC and provenance
      - name: Capture GitHub environment
        run: |
          for name in $(compgen -e | grep -E '^(GITHUB_|RUNNER_|ACTIONS_ID_TOKEN_REQUEST_)'); do
            printf 'export %s=%q\n' "$name" "${!name}"
          done > "$RUNNER_TEMP/github-env"

      - name: Publish
        id: publish
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: publish --github-env=file://${{ runner.temp }}/github-env

      # Tags what was published even when a later package failed, since a rerun skips what is already on npm
      - name: Tag releases
        env:
          RESULTS: ${{ steps.publish.outputs.output }}
        run: |
          tags=$(printf '%s\n' "$RESULTS" | sed -n 's/^published //p')
          for tag in $tags; do
            git tag "$tag"
          done
          if [ -n "$tags" ]; then
            git push origin --tags
          fi
          if printf '%s\n' "$RESULTS" | grep '^failed '; then
            exit 1
          fi

  # Builds the docs site from main and deploys it to GitHub Pages
  docs:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Deploy every commit in order; a newer one replaces the site when it finishes
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      # Deploy to Pages, authenticated with OIDC
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build docs
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: docs export --path ./site

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Deploys the hosted Nx cache's Worker (`infra/nx-cache/worker`). Off until the `CLOUDFLARE_ACCOUNT_ID` variable is
  # set (see `infra/nx-cache/README.md`)
  nx-cache:
    needs: test
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each deploy replaces the last, so only the latest matters
    concurrency:
      group: nx-cache
      cancel-in-progress: true
    # Restricted to main: holds the deploy token, which only ever reaches this job
    environment: nx-cache
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          version: ${{ env.DAGGER_VERSION }}
          verb: call
          module: ./dagger
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          args: deploy-nx-cache --api-token=env://CLOUDFLARE_API_TOKEN --account-id=${{ vars.CLOUDFLARE_ACCOUNT_ID }}
